name: Exact certificate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r certificate/requirements.txt
      - run: python -B -s verify_package.py
      - name: Fresh exact replay
        run: python -B -s certificate/verify.py --output "$RUNNER_TEMP/werner-normal" --phase all --max-seconds 1200
      - name: Fresh optimized exact replay
        run: python -O -B -s certificate/verify.py --output "$RUNNER_TEMP/werner-optimized" --phase all --max-seconds 1200
      - name: Semantic controls and supplied congruences
        run: |
          python -B -s check_controls.py --replay "$RUNNER_TEMP/werner-normal"
          python -O -B -s check_controls.py --replay "$RUNNER_TEMP/werner-optimized"
          python -B -s check_review_congruences.py
          python -O -B -s check_review_congruences.py
          python -B -s verify_package.py
